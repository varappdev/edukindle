[project]
name = "edukindle-server"
version = "0.1.0"
description = "EduKindle study & assessment server (multi-agent, OpenAI-backed)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.60",
    "networkx>=3.3",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
edukindle-server = "edukindle.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edukindle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
